name: vulnera
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  http: ^1.2.2
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.4
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "android/app/src/main/res/drawable/vulnera.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/vulnera.png
